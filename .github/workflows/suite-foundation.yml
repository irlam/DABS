name: Suite integration foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, mbstring
      - name: Configuration syntax
        run: |
          php -l includes/database_config.php
          php -l includes/db_connect.php
          php -l tests/database-config.php
      - name: Private configuration and rejection cases
        run: php tests/database-config.php

      - name: No legacy database shortcuts
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/central-database.php
      - name: Authentication, roles, methods and CSRF rejection
        run: php tests/request-policy.php
      - name: Real entry points reject before database access
        run: php tests/endpoint-rejection.php
      - name: Browser CSRF transport
        run: node tests/request-security.mjs
      - name: Suite navigation and editor resilience
        run: |
          php tests/suite-ui.php
          node tests/safety-editor.mjs
      - name: Dedicated Suite binding, sessions, roles and private configuration
        run: php tests/suite-gateway.php
      - name: Hosting warnings fail closed over HTTP
        run: php tests/gateway-bootstrap.php
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Suite desktop/mobile browser and disposable company fixtures
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: dabs-suite-ui-previews
          path: test-output/
      - name: Clean deployment code package
        run: python3 bin/package-suite.py
      - uses: actions/upload-artifact@v4
        with:
          name: dabs-suite-code
          path: |
            dist/dabs-suite.zip
            dist/dabs-suite.sha256
  clean-install:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dabs-ci-only
          MYSQL_DATABASE: dabs_ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdabs-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
      - name: Empty schema, preflight, provisioning and safe rerun
        env:
          DABS_CI_DATABASE: '1'
        run: php tests/mysql-provision.php
